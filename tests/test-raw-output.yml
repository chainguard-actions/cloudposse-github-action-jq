name: Test jq eval with raw string output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Node.js is available as node24
        run: |
          node --version || true
          if ! command -v node24 >/dev/null 2>&1; then
            NODE_BIN=$(command -v node || true)
            if [ -n "$NODE_BIN" ]; then
              sudo ln -sf "$NODE_BIN" /usr/local/bin/node24 || true
            fi
          fi
          node --version
      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          jq --version
      - id: action-raw
        uses: .
        with:
          input: '{"greeting":"hello world"}'
          script: '.greeting'
          raw-output: 'true'
      - name: Assert raw output has no JSON quotes
        env:
          ACTUAL: ${{ steps.action-raw.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello world" ]; then
            echo "FAIL: expected 'hello world' (unquoted) but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - id: action-json
        uses: .
        with:
          input: '{"greeting":"hello world"}'
          script: '.greeting'
          raw-output: 'false'
      - name: Assert non-raw output has JSON quotes
        env:
          ACTUAL: ${{ steps.action-json.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != '"hello world"' ]; then
            echo "FAIL: expected '\"hello world\"' (JSON-quoted) but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
