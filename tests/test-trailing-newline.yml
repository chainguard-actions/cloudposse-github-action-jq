name: Test jq eval remove-trailing-newline option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Node.js is available as node24
        run: |
          node --version || true
          if ! command -v node24 >/dev/null 2>&1; then
            NODE_BIN=$(command -v node || true)
            if [ -n "$NODE_BIN" ]; then
              sudo ln -sf "$NODE_BIN" /usr/local/bin/node24 || true
            fi
          fi
          node --version
      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          jq --version
      - id: no-trailing-newline
        uses: .
        with:
          input: '{"key":"value"}'
          script: '.key'
          raw-output: 'true'
          remove-trailing-newline: 'true'
      - name: Assert output has no trailing newline (default behavior)
        env:
          ACTUAL: ${{ steps.no-trailing-newline.outputs.output }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ "$ACTUAL" != "value" ]; then
            echo "FAIL: expected 'value' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - id: numeric-output
        uses: .
        with:
          input: '{"count":99}'
          script: '.count'
          remove-trailing-newline: 'true'
      - name: Assert numeric output is correct
        env:
          ACTUAL: ${{ steps.numeric-output.outputs.output }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ "$ACTUAL" != "99" ]; then
            echo "FAIL: expected '99' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
